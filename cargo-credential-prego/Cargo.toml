[package]
name = "cargo-credential-prego"
version = "0.5.0"
description = "Cargo credential provider for Prego by Katskill registries. Exchanges a machine identity for a short-lived registry token."
readme = "README.md"
keywords = ["cargo", "credential-provider", "prego", "spiffe", "oidc"]
categories = ["development-tools::cargo-plugins", "authentication"]
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["spiffe"]
# SPIFFE Workload API source.
spiffe = ["prego-auth/spiffe"]

[dependencies]
prego-auth = { version = "0.5.0", path = "../prego-auth", default-features = false }
cargo-credential = "0.4.10"
time = "0.3"

[dev-dependencies]
prego-auth = { version = "0.5.0", path = "../prego-auth", default-features = false, features = ["test-support"] }
serde_json = "1"
