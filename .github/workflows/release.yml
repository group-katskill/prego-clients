name: Release

# One release for the workspace: cargo-credential-prego, docker-credential-prego and prego, with the same
# version. Tag: prego-clients-vX.Y.Z.

on:
  push:
    tags:
      - "prego-clients-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92.0"
  BINARIES: "cargo-credential-prego docker-credential-prego prego"
  ZIG_VERSION: "0.13.0"
  ZIG_SHA256: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
  ZIGBUILD_VERSION: "0.22.1"

jobs:
  check-tag:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare tag and crate versions
        run: |
          want="${GITHUB_REF_NAME#prego-clients-v}"
          echo "Tag: ${GITHUB_REF_NAME}. Version: ${want}."
          for crate in prego-auth $BINARIES; do
            pkgid="$(cargo pkgid --manifest-path "$crate/Cargo.toml" -p "$crate")"
            version="${pkgid##*[#@]}"
            echo "${crate}: ${version}"
            test "$version" = "$want"
          done

  build:
    name: Build ${{ matrix.target }}
    needs: check-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          # TODO: the macOS binaries link without the macOS SDK and are not code-signed. Check them on a
          # Mac before the first release, and add signing and notarization if Gatekeeper refuses them.
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - name: Install zig (checksum verified)
        run: |
          curl -sSfL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version "$ZIGBUILD_VERSION"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          for bin in $BINARIES; do args+=(-p "$bin"); done
          PREGO_GIT_COMMIT="${GITHUB_SHA::12}" \
            cargo zigbuild --locked --release "${args[@]}" --target "$TARGET"

      # One archive with all three binaries (for install.sh), and one archive per binary (for CI jobs
      # that need only one). Each archive has a .sha256 file.
      - name: Package with SHA-256 sums
        env:
          TARGET: ${{ matrix.target }}
        run: |
          out="target/${TARGET}/release"
          mkdir -p dist
          cp LICENSE NOTICE README.md "$out/"
          # shellcheck disable=SC2086 # BINARIES is a word list
          tar -C "$out" -czf "dist/prego-clients-${TARGET}.tar.gz" $BINARIES LICENSE NOTICE README.md
          for bin in $BINARIES; do
            tar -C "$out" -czf "dist/${bin}-${TARGET}.tar.gz" "$bin" LICENSE NOTICE README.md
          done
          cd dist
          for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless signing: cosign gets a short-lived certificate for the GitHub OIDC identity of this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Add install.sh and SHA256SUMS
        run: |
          cp install.sh dist/
          cd dist
          sha256sum install.sh ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      # SHA256SUMS lists every asset, so its signature covers all of them. The bundle holds the signature, the
      # certificate (issued to this workflow at this tag) and the transparency log entry.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign SHA256SUMS (cosign keyless, GitHub OIDC)
        run: |
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Create release with binaries and sums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          # A version with "-" (for example the tag prego-clients-v0.6.0-rc.1) is a pre-release and never Latest, so
          # releases/latest/download/install.sh keeps giving the newest X.Y.Z release.
          # Look only at the version: the tag prefix prego-clients-v has "-" too.
          version="${GITHUB_REF_NAME#prego-clients-v}"
          extra=()
          case "$version" in
            *-*) extra=(--prerelease --latest=false) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            "${extra[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "cargo-credential-prego, docker-credential-prego and prego. See the CHANGELOG.md of each crate. Install: download install.sh and run it, or check each archive with its .sha256 file. SHA256SUMS is signed with cosign (keyless, GitHub OIDC): see Verify a release in the README."

  # crates.io publish is not part of this workflow. It needs a separate go and the CARGO_REGISTRY_TOKEN
  # secret. Order when it comes: prego-auth first, then the three binaries.
