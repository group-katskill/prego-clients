name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92.0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - name: shellcheck install.sh
        run: shellcheck --severity=warning install.sh

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo clippy (no default features)
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: Install pnpm for the live npm and pnpm tests
        run: npm install --global pnpm@10.28.0

      - name: cargo test (default features)
        run: cargo test --locked --workspace
        env:
          PREGO_TEST_NPM: "1"

      - name: cargo test (no default features)
        run: cargo test --locked --workspace --no-default-features
        env:
          PREGO_TEST_NPM: "1"

  macos:
    # The release builds the macOS binaries on macOS (the keychain code needs the macOS SDK). This job checks
    # that build and runs the tests there.
    name: macOS build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: cargo test (default features)
        run: cargo test --locked --workspace

  keyrings-prego:
    # keyrings.prego (pure Python): build the sdist and the wheel, install the wheel, run the tests against
    # the installed package with a fake prego. It is not published from CI.
    name: keyrings.prego build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        working-directory: keyrings-prego
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet build==1.6.1 pytest==9.2.0 keyring==25.7.0
          "$RUNNER_TEMP/venv/bin/python" -m build --outdir "$RUNNER_TEMP/dist" .
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps "$RUNNER_TEMP"/dist/*.whl
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider tests
