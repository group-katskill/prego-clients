name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92.0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - name: shellcheck install.sh
        run: shellcheck --severity=warning install.sh

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo clippy (no default features)
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: cargo test (default features)
        run: cargo test --locked --workspace

      - name: cargo test (no default features)
        run: cargo test --locked --workspace --no-default-features
