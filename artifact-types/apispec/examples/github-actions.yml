# Publish the OpenAPI document of a release tag (v1.4.0 -> version 1.4.0) to Prego.
# The job uses its own OIDC identity: no stored secret. The publish gets an ADR-0065 attestation.
name: publish-api-spec
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREGO_TENANT: acme
      PREGO_EDGE_CODE: k7mq
    steps:
      - uses: actions/checkout@v4
      - name: Install prego
        run: |
          curl -fsSLO https://github.com/group-katskill/prego-clients/releases/latest/download/install.sh
          sh install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish the API spec
        run: prego apispec push openapi.yaml "acme/payments-api@${GITHUB_REF_NAME#v}" --message "$GITHUB_SHA"
