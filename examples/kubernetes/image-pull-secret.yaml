# image-pull-secret.yaml: pull images from the Prego registry of tenant `acme` in Kubernetes.
#
# Console setup (once, by a tenant admin):
#   - principal: kind api_key, one per cluster, at most 90 days
#   - grant: read on the repositories the cluster pulls (ecosystem oci, or any)
#
# The username is the tenant. The password is the API key. Replace prk_REPLACE_ME with the key, but do not
# commit the result: keep the key in your secret store (for example Sealed Secrets, External Secrets or SOPS),
# and make a new key and update this secret before the old key expires.
apiVersion: v1
kind: Secret
metadata:
  name: prego-pull
  namespace: apps
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "oci.prego.k8skill.com": {
          "username": "acme",
          "password": "prk_REPLACE_ME"
        }
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: apps
spec:
  imagePullSecrets:
    - name: prego-pull
  containers:
    - name: api
      image: oci.prego.k8skill.com/acme/default/api:1.4.0
---
# Or attach the secret to a service account, so every pod that uses it can pull:
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: apps
imagePullSecrets:
  - name: prego-pull
