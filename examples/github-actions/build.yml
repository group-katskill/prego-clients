# .github/workflows/build.yml: build with crates from the Prego registry of tenant `acme`.
#
# Console setup (once, by a tenant admin):
#   - trust config: kind oidc, issuer https://token.actions.githubusercontent.com
#   - principal: kind oidc, claims_match {"repository": "acme/core", "ref": "refs/heads/main"}
#   - grant: read on the crates this job needs
#
# The job stores no secret. GitHub gives it a short-lived OIDC token, and cargo-credential-prego exchanges
# that token at the Prego STS.

name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # lets the job request an OIDC token for Prego

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PREGO_VERSION: "0.3.0"
      PREGO_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install the prebuilt binary and check its SHA-256 sum. `cargo install --locked
      # cargo-credential-prego` also works, but takes longer.
      - name: Install cargo-credential-prego
        run: |
          base="https://github.com/group-katskill/prego-clients/releases/download/prego-clients-v${PREGO_VERSION}"
          file="cargo-credential-prego-${PREGO_TARGET}.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/${file}.sha256"
          sha256sum -c "${file}.sha256"
          tar -xzf "${file}" cargo-credential-prego
          install -m 0755 cargo-credential-prego "$HOME/.cargo/bin/"
          cargo-credential-prego --version

      # .cargo/config.toml is in the repository (see examples/cargo/config.toml).
      - name: Build and test
        run: |
          cargo build --locked
          cargo test --locked
