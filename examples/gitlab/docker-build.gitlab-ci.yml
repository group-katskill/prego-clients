# docker-build.gitlab-ci.yml: build an image and push it to the Prego registry of tenant `acme`.
#
# Console setup (once, by a tenant admin):
#   - trust config: kind oidc, issuer https://gitlab.com (or your self-managed GitLab URL)
#   - principal: kind oidc, claims_match {"project_path": "acme/api", "ref_protected": "true"}
#   - grant: publish on the repository acme/default/api (ecosystem oci, or any)
#
# The job stores no secret. GitLab gives it a short-lived ID token in PREGO_ID_TOKEN. Docker sends that token to
# the Prego token realm only, and the token expires after the job. docker login and prego oci push take the token
# address from the registry's challenge, so these jobs need no edge code.

variables:
  PREGO_VERSION: "0.7.0"
  PREGO_TARGET: x86_64-unknown-linux-musl
  PREGO_TENANT: acme
  OCI_HOST: oci.prego.k8skill.com
  IMAGE: oci.prego.k8skill.com/acme/default/api

build-image:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  id_tokens:
    PREGO_ID_TOKEN:
      aud: prego.k8skill.com
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  script:
    # The ID token goes on stdin, so it does not show in the process list.
    - printf '%s' "$PREGO_ID_TOKEN" | docker login "$OCI_HOST" -u "$PREGO_TENANT" --password-stdin
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker logout "$OCI_HOST"

# Use this template in place of build-image when a layer is larger than 95 MiB. docker push sends each layer in
# one request and fails above 95 MiB; prego oci push sends it in parts. prego finds PREGO_ID_TOKEN by itself.
# To use it: `build-big-image: { extends: .build-big-image }`.
.build-big-image:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  id_tokens:
    PREGO_ID_TOKEN:
      aud: prego.k8skill.com
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  before_script:
    # Install prego from the release and check its SHA-256 sum.
    - apk add --no-cache curl
    - base="https://github.com/group-katskill/prego-clients/releases/download/prego-clients-v${PREGO_VERSION}"
    - file="prego-${PREGO_TARGET}.tar.gz"
    - curl -fsSLO "${base}/${file}"
    - curl -fsSLO "${base}/${file}.sha256"
    - sha256sum -c "${file}.sha256"
    - tar -xzf "${file}" prego
    - install -m 0755 prego /usr/local/bin/
    - prego --version
  script:
    - docker build -t api:build .
    - docker save api:build -o api.tar
    - prego oci push api.tar "acme/default/api:$CI_COMMIT_SHORT_SHA"
