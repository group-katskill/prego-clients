[package]
name = "docker-credential-prego"
version = "0.9.0"
description = "Docker credential helper for Prego by Katskill OCI registries. Gives Docker a machine identity for the Prego token realm."
readme = "README.md"
keywords = ["docker", "credential-helper", "oci", "prego", "spiffe"]
categories = ["command-line-utilities", "authentication"]
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["spiffe", "session"]
# SPIFFE Workload API source.
spiffe = ["prego-auth/spiffe"]
# Device session of `prego login`, in the OS keychain or the kernel keyring.
session = ["prego-auth/session"]

[dependencies]
prego-auth = { version = "0.9.0", path = "../prego-auth", default-features = false }
serde_json = "1"

[dev-dependencies]
prego-auth = { version = "0.9.0", path = "../prego-auth", default-features = false, features = ["test-support"] }
