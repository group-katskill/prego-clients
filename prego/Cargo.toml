[package]
name = "prego"
version = "0.9.0"
description = "Command-line tool for Prego by Katskill: registry tokens, whoami, setup for Cargo, Docker and Go, chunked OCI image push, Go module publish and the GOAUTH helper."
readme = "README.md"
keywords = ["prego", "registry", "oci", "cargo", "go"]
categories = ["command-line-utilities", "authentication"]
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["spiffe", "session"]
# SPIFFE Workload API source.
spiffe = ["prego-auth/spiffe"]
# Device session of `prego login`, in the OS keychain or the kernel keyring.
session = ["prego-auth/session"]

[dependencies]
prego-auth = { version = "0.9.0", path = "../prego-auth", default-features = false }
# preserve_order keeps the key order of ~/.docker/config.json when `prego setup docker --write` changes it.
base64 = "0.22"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# float_roundtrip: exact number parsing, so the RFC 8785 hash of `prego env` equals the registry hash.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# `prego oci push`: blob digests, and the docker save tar format.
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
# `prego setup python`: edits pyproject.toml and keeps its other lines and comments.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
prego-auth = { version = "0.9.0", path = "../prego-auth", default-features = false, features = ["test-support"] }
